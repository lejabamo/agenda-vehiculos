services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vehiculos_user
      POSTGRES_PASSWORD: vehiculos_pass
      POSTGRES_DB: vehiculos_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vehiculos_user -d vehiculos_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
      - ./docs:/app/docs
    ports:
      - "8001:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5174:5174"
    environment:
      - VITE_API_URL=http://backend:8000
    depends_on:
      - backend

  mailpit:
    image: axllent/mailpit
    ports:
      - "8026:8025"
      - "1026:1025"

volumes:
  postgres_data:
