server {
    listen 80;
    server_name _;

    # El Global Proxy intercepta /vehiculos/ y hace proxy_pass a http://vehiculos_nginx:80/
    # Esto elimina el prefijo /vehiculos/, permitiéndonos servir desde la raíz de nginx.
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Proxear llamadas a la API hacia el backend
    location /api/ {
        proxy_pass http://vehiculos_backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        # Importante para Single Page Applications (React Router)
        try_files $uri $uri/ /index.html;
    }

    # Caché estática para assets cacheados por Vite (tienen hashes únicos en el nombre)
    location ~* \.(?:css|js|jpe?g|png|svg|ico|woff2?|eot|ttf|otf|mp4|webm)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public";
        try_files $uri $uri/ /index.html;
    }
}
